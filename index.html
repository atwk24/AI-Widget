<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>長者 AI 守護助手 - 手機網頁版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      color: #050505;
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 手機頂部 Facebook 導航欄 (全寬) */
    .fb-header {
      background-color: #ffffff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .fb-logo {
      font-size: 24px;
      font-weight: bold;
      color: #1877f2;
    }

    /* 頁面主體內容 */
    .page-body {
      flex: 1;
      width: 100%;
      padding-bottom: 140px; /* 預留底部 Keyboard Plugin 空間 */
    }

    .fb-post {
      background-color: #ffffff;
      margin-top: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      width: 100%;
    }

    .post-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
    }

    .page-avatar {
      width: 40px;
      height: 40px;
      background-color: #005a9c;
      color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 16px;
      margin-right: 10px;
    }

    .page-info h3 {
      font-size: 15px;
      color: #050505;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .page-info span {
      font-size: 12px;
      color: #65676b;
    }

    /* 文章內容 (支援 iPhone 長按選取) */
    .post-text {
      padding: 0 16px 12px 16px;
      font-size: 18px;
      color: #050505;
      line-height: 1.6;
      font-weight: 400;
      user-select: text;
      -webkit-user-select: text;
    }

    .ai-highlight-text {
      background-color: #ffd7d9;
      color: #d9381e;
      padding: 2px 4px;
      border-radius: 4px;
      font-weight: bold;
    }

    .post-image-container {
      width: 100%;
      height: 240px;
      background-color: #000;
    }

    .post-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .post-stats {
      display: flex;
      justify-content: space-between;
      padding: 10px 16px;
      font-size: 13px;
      color: #65676b;
      border-bottom: 1px solid #e4e6eb;
    }

    .post-actions {
      display: flex;
      justify-content: space-around;
      padding: 4px 0;
    }

    .action-item {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      font-size: 15px;
      color: #65676b;
      font-weight: 600;
      cursor: pointer;
    }

    .action-item:active { background-color: #f0f2f5; }

    /* 模擬 Google Keyboard (Gboard) AI 偵測插件欄 */
    .keyboard-plugin-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #f7f9fa;
      border-top: 1px solid #ccc;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
      z-index: 150;
      display: none;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .plugin-header {
      background-color: #1a73e8;
      color: white;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .plugin-body {
      padding: 14px 16px;
      font-size: 16px;
      color: #333;
      line-height: 1.5;
    }

    .keyboard-mock-bg {
      background-color: #cfd8dc;
      padding: 10px 6px;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      text-align: center;
    }

    .key {
      background: #fff;
      padding: 10px 0;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 1px 1px rgba(0,0,0,0.2);
    }

    /* 右側懸浮小圓點 (小白點) */
    .floating-ball {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      border: 2px solid #007aff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 120;
    }
